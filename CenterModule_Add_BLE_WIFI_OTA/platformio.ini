; PlatformIO Project Configuration File

[platformio]
; Normal Upload button will use USB.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Changed from huge_app.csv - that scheme has no OTA slots.
; min_spiffs.csv gives two ~1.9MB OTA app slots.
; Rebuild and check flash usage % before relying on this.
board_build.partitions = min_spiffs.csv

lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.17
    Wire

; USB upload environment
upload_protocol = esptool


[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota

; Center device
upload_port = imu-center.local
; Or use its IP directly if mDNS is unreliable on your router:
; upload_port = 192.168.8.XXX

; Must match OTA_PORT and OTA_PASSWORD in ota_update.cpp
upload_flags =
    --port=3232
    --auth=Hirushan123